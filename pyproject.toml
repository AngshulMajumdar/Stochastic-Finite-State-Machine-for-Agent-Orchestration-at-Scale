[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfsm-orchestration"
version = "1.2.0"
description = "Reproducible FSM/SFSM orchestration experiments and MapReduce implementation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Angshul Majumdar", email = "angshul@iiitd.ac.in"}]
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "matplotlib==3.10.8",
  "numba==0.65.1", "networkx==3.6.1", "scipy==1.17.0"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.10"]

[project.scripts]
sfsm-benchmark = "sfsm_orchestration.benchmark:main"
sfsm-verify = "sfsm_orchestration.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
